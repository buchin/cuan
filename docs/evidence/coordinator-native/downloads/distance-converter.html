<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Distance Converter</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #f0f4f8;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .card {
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.10);
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 420px;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: #1a202c;
      margin-bottom: 0.25rem;
    }

    .subtitle {
      font-size: 0.9rem;
      color: #718096;
      margin-bottom: 2rem;
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: #4a5568;
      margin-bottom: 0.4rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    input[type="number"] {
      width: 100%;
      padding: 0.75rem 1rem;
      font-size: 1.1rem;
      border: 2px solid #e2e8f0;
      border-radius: 8px;
      outline: none;
      color: #1a202c;
      transition: border-color 0.2s;
      -moz-appearance: textfield;
    }

    input[type="number"]::-webkit-outer-spin-button,
    input[type="number"]::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    input[type="number"]:focus {
      border-color: #4299e1;
    }

    .results {
      margin-top: 1.75rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .result-box {
      background: #ebf8ff;
      border: 2px solid #bee3f8;
      border-radius: 8px;
      padding: 1rem 1.25rem;
    }

    .result-box .result-label {
      font-size: 0.78rem;
      font-weight: 600;
      color: #2b6cb0;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.25rem;
    }

    .result-box .result-value {
      font-size: 1.4rem;
      font-weight: 700;
      color: #1a365d;
    }

    .result-box .result-unit {
      font-size: 0.95rem;
      font-weight: 500;
      color: #4a5568;
      margin-left: 0.25rem;
    }

    .empty-state {
      color: #a0aec0;
      font-size: 1.1rem;
      font-weight: 400;
    }

    .factors {
      margin-top: 2rem;
      padding-top: 1.25rem;
      border-top: 1px solid #e2e8f0;
      font-size: 0.78rem;
      color: #a0aec0;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Distance Converter</h1>
    <p class="subtitle">Kilometres → Miles &amp; Meters</p>

    <label for="km-input">Kilometres</label>
    <input
      type="number"
      id="km-input"
      placeholder="Enter km value"
      min="0"
      step="any"
      autofocus
    >

    <div class="results">
      <div class="result-box">
        <div class="result-label">Miles</div>
        <div class="result-value" id="miles-output">
          <span class="empty-state">—</span>
        </div>
      </div>
      <div class="result-box">
        <div class="result-label">Meters</div>
        <div class="result-value" id="meters-output">
          <span class="empty-state">—</span>
        </div>
      </div>
    </div>

    <div class="factors">
      Conversion factors: 1 km = 0.621371 miles &nbsp;|&nbsp; 1 km = 1,000 meters
    </div>
  </div>

  <script>
    const KM_TO_MILES = 0.621371;
    const KM_TO_METERS = 1000;

    const input       = document.getElementById('km-input');
    const milesOutput = document.getElementById('miles-output');
    const metersOutput = document.getElementById('meters-output');

    function formatNumber(value, decimals) {
      return value.toLocaleString('en-US', {
        minimumFractionDigits: 0,
        maximumFractionDigits: decimals
      });
    }

    function convert() {
      const raw = input.value.trim();

      if (raw === '' || isNaN(parseFloat(raw))) {
        milesOutput.innerHTML  = '<span class="empty-state">—</span>';
        metersOutput.innerHTML = '<span class="empty-state">—</span>';
        return;
      }

      const km = parseFloat(raw);
      const miles   = km * KM_TO_MILES;
      const meters  = km * KM_TO_METERS;

      milesOutput.innerHTML  = formatNumber(miles, 6)  + '<span class="result-unit">mi</span>';
      metersOutput.innerHTML = formatNumber(meters, 2) + '<span class="result-unit">m</span>';
    }

    input.addEventListener('input', convert);
  </script>
</body>
</html>
