<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Packing Checklist</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f0f4f8;
      color: #2d3748;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 2rem 1rem;
    }

    .container {
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.10);
      padding: 2rem;
      width: 100%;
      max-width: 540px;
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      margin-bottom: 0.25rem;
      color: #1a202c;
    }

    .subtitle {
      font-size: 0.9rem;
      color: #718096;
      margin-bottom: 1.5rem;
    }

    .add-row {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
    }

    .add-row input[type="text"] {
      flex: 1;
      padding: 0.6rem 0.85rem;
      border: 2px solid #e2e8f0;
      border-radius: 8px;
      font-size: 1rem;
      color: #2d3748;
      transition: border-color 0.2s;
      outline: none;
    }

    .add-row input[type="text"]:focus {
      border-color: #4299e1;
    }

    .add-row input[type="text"]::placeholder {
      color: #a0aec0;
    }

    button {
      cursor: pointer;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      padding: 0.6rem 1.1rem;
      transition: background 0.15s, transform 0.1s;
    }

    button:active {
      transform: scale(0.97);
    }

    .btn-add {
      background: #4299e1;
      color: #fff;
      white-space: nowrap;
    }

    .btn-add:hover {
      background: #3182ce;
    }

    .stats {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.75rem;
      font-size: 0.85rem;
      color: #718096;
    }

    .stats strong {
      color: #4299e1;
    }

    #item-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
      min-height: 2rem;
    }

    .item {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      background: #f7fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 0.65rem 0.85rem;
      transition: background 0.15s;
    }

    .item:hover {
      background: #edf2f7;
    }

    .item input[type="checkbox"] {
      width: 1.1rem;
      height: 1.1rem;
      flex-shrink: 0;
      accent-color: #48bb78;
      cursor: pointer;
    }

    .item-label {
      flex: 1;
      font-size: 1rem;
      word-break: break-word;
      transition: color 0.2s;
    }

    .item.packed .item-label {
      text-decoration: line-through;
      color: #a0aec0;
    }

    .btn-remove {
      background: #fff5f5;
      color: #e53e3e;
      border: 1px solid #fed7d7;
      font-size: 0.82rem;
      padding: 0.3rem 0.65rem;
      flex-shrink: 0;
    }

    .btn-remove:hover {
      background: #fed7d7;
    }

    .empty-state {
      text-align: center;
      padding: 1.5rem 0;
      color: #a0aec0;
      font-size: 0.95rem;
    }

    .footer-row {
      display: flex;
      justify-content: flex-end;
    }

    .btn-reset {
      background: #fff;
      color: #718096;
      border: 1.5px solid #e2e8f0;
      font-size: 0.85rem;
      padding: 0.5rem 1rem;
    }

    .btn-reset:hover {
      background: #edf2f7;
      color: #e53e3e;
      border-color: #fed7d7;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🧳 Packing Checklist</h1>
    <p class="subtitle">Your items are saved automatically in this browser.</p>

    <div class="add-row">
      <input
        type="text"
        id="new-item-input"
        placeholder="Add an item (e.g. Passport)"
        maxlength="200"
        autocomplete="off"
      />
      <button class="btn-add" id="add-btn">Add</button>
    </div>

    <div class="stats">
      <span id="stats-text">0 items</span>
    </div>

    <ul id="item-list"></ul>

    <div class="footer-row">
      <button class="btn-reset" id="reset-btn">🗑 Reset / Clear All</button>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'packing-checklist-v1';

    // ── State ──────────────────────────────────────────────────────────────
    let items = []; // [{ id, text, packed }]

    function generateId() {
      return Date.now().toString(36) + Math.random().toString(36).slice(2);
    }

    // ── Persistence ────────────────────────────────────────────────────────
    function save() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
      } catch (e) {
        // Silently ignore (e.g. private browsing with storage disabled)
      }
    }

    function load() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (Array.isArray(parsed)) {
            items = parsed.filter(
              (i) => i && typeof i.id === 'string' && typeof i.text === 'string'
            );
          }
        }
      } catch (e) {
        items = [];
      }
    }

    // ── Rendering ──────────────────────────────────────────────────────────
    function render() {
      const list = document.getElementById('item-list');
      const statsEl = document.getElementById('stats-text');

      list.innerHTML = '';

      if (items.length === 0) {
        const empty = document.createElement('li');
        empty.className = 'empty-state';
        empty.textContent = 'No items yet — add something above!';
        list.appendChild(empty);
      } else {
        items.forEach((item) => {
          const li = document.createElement('li');
          li.className = 'item' + (item.packed ? ' packed' : '');
          li.dataset.id = item.id;

          const checkbox = document.createElement('input');
          checkbox.type = 'checkbox';
          checkbox.checked = item.packed;
          checkbox.setAttribute('aria-label', 'Mark ' + item.text + ' as packed');
          checkbox.addEventListener('change', () => togglePacked(item.id));

          const label = document.createElement('span');
          label.className = 'item-label';
          label.textContent = item.text;

          const removeBtn = document.createElement('button');
          removeBtn.className = 'btn-remove';
          removeBtn.textContent = 'Remove';
          removeBtn.setAttribute('aria-label', 'Remove ' + item.text);
          removeBtn.addEventListener('click', () => removeItem(item.id));

          li.appendChild(checkbox);
          li.appendChild(label);
          li.appendChild(removeBtn);
          list.appendChild(li);
        });
      }

      const total = items.length;
      const packed = items.filter((i) => i.packed).length;
      if (total === 0) {
        statsEl.innerHTML = '0 items';
      } else {
        statsEl.innerHTML =
          '<strong>' + packed + '</strong> of <strong>' + total + '</strong> packed';
      }
    }

    // ── Actions ────────────────────────────────────────────────────────────
    function addItem(text) {
      const trimmed = text.trim();
      if (!trimmed) return;
      items.push({ id: generateId(), text: trimmed, packed: false });
      save();
      render();
    }

    function removeItem(id) {
      items = items.filter((i) => i.id !== id);
      save();
      render();
    }

    function togglePacked(id) {
      items = items.map((i) =>
        i.id === id ? { ...i, packed: !i.packed } : i
      );
      save();
      render();
    }

    function resetAll() {
      if (items.length === 0) return;
      if (!confirm('Clear all items? This cannot be undone.')) return;
      items = [];
      save();
      render();
    }

    // ── Event wiring ───────────────────────────────────────────────────────
    document.getElementById('add-btn').addEventListener('click', () => {
      const input = document.getElementById('new-item-input');
      addItem(input.value);
      input.value = '';
      input.focus();
    });

    document.getElementById('new-item-input').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        const input = e.currentTarget;
        addItem(input.value);
        input.value = '';
      }
    });

    document.getElementById('reset-btn').addEventListener('click', resetAll);

    // ── Boot ───────────────────────────────────────────────────────────────
    load();
    render();
  </script>
</body>
</html>
